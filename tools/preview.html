<!doctype html><meta charset="utf-8"><title>bento-readme preview</title>
<body style="margin:0;background:#777">
<!-- dev tool: serve the repo root (python -m http.server 8765) and open /tools/preview.html
     optional: ?only=neon  shows just the images whose file name contains "neon" -->
<div id="g" style="display:grid;gap:8px;padding:8px"></div>
<script>
const files = ["designer.svg", "developer-dark.svg", "developer-light.svg", "editorial.svg", "minimal.svg", "neon.svg", "pastel-dark.svg", "pastel-light.svg", "terminal.svg"];
const only = new URLSearchParams(location.search).get("only");
const shown = files.filter(f => !only || f.includes(only));
const g = document.getElementById("g");
g.style.gridTemplateColumns = only ? "1fr" : "1fr 1fr";
for (const f of shown) { const i = new Image(); i.src = "../examples/img/" + f; i.title = f; i.style.width = "100%"; g.append(i); }
</script>
